{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <h2>Editar Tarefa</h2>
        <form method="POST">
            <div class="mb-3">
                <label>Título:</label>
                <input type="text" name="titulo" value="{{ tarefa.titulo }}" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Descrição:</label>
                <textarea name="descricao" class="form-control">{{ tarefa.descricao }}</textarea>
            </div>
            <div class="mb-3">
                <label>Status:</label>
                <select name="status" class="form-select">
                    <option value="Pendente" {% if tarefa.status == 'Pendente' %}selected{% endif %}>Pendente</option>
                    <option value="Em andamento" {% if tarefa.status == 'Em andamento' %}selected{% endif %}>Em andamento</option>
                    <option value="Concluída" {% if tarefa.status == 'Concluída' %}selected{% endif %}>Concluída</option>
                </select>
            </div>
            <button type="submit" class="btn btn-success">Atualizar</button>
            <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
