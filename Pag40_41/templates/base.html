<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Painel de Tarefas</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body id="body-app">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('dashboard') }}">Gerenciador de Tarefas</a>
            <div class="d-flex align-items-center">
                {% if session.get('user_id') %}
                    <a href="{{ url_for('logout') }}" class="btn btn-outline-light btn-sm me-3">Sair</a>
                {% endif %}
                <button class="btn btn-sm btn-secondary" onclick="toggleDarkMode()"><i class="bi bi-moon-fill"></i></button>
            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <!-- Script de Persistência do Modo Escuro (Requisito 9) -->
    <script>
        function toggleDarkMode() {
            const body = document.body;
            body.classList.toggle('bg-dark');
            body.classList.toggle('text-light');
            
            if (body.classList.contains('bg-dark')) {
                localStorage.setItem('theme', 'dark');
            } else {
                localStorage.setItem('theme', 'light');
            }
        }

        window.onload = () => {
            if (localStorage.getItem('theme') === 'dark') {
                document.body.classList.add('bg-dark', 'text-light');
            }
        }
    </script>
</body>
</html>
